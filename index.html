<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>GS25 한화생명볼파크 메뉴판</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

<style>
:root{
  --gs-blue:#006fcf;
  --gs-sky:#00a9e0;
  --gs-orange:#ff7a00;
  --bg1:#eef3f8;
  --bg2:#dde8f5;
  --text:#17212b;
  --muted:#667085;
  --line:#e5edf6;
  --card:rgba(255,255,255,0.72);
  --shadow:0 12px 30px rgba(13, 38, 76, 0.10);
  --radius:22px;
}

*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;
  color:var(--text);
  background:
    radial-gradient(circle at top left, rgba(255,255,255,.85), transparent 28%),
    linear-gradient(135deg,var(--bg1),var(--bg2));
}

.header{
  position:sticky;
  top:0;
  z-index:100;
  backdrop-filter:blur(14px);
  background:linear-gradient(90deg, rgba(0,111,207,.94), rgba(0,169,224,.92));
  box-shadow:0 6px 18px rgba(0,0,0,.12);
}

.header-inner{
  max-width:1180px;
  margin:0 auto;
  padding:14px 16px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
}

.brand{
  display:flex;
  align-items:center;
  gap:12px;
  color:#fff;
  font-weight:800;
  letter-spacing:-0.3px;
}

.brand img{
  height:42px;
  width:auto;
  display:block;
}

.brand-text{
  display:flex;
  flex-direction:column;
  line-height:1.1;
}

.brand-text small{
  font-size:12px;
  opacity:.88;
  font-weight:600;
}

.header-right{
  display:flex;
  align-items:center;
  gap:8px;
}

.pill{
  color:#fff;
  border:1px solid rgba(255,255,255,.28);
  background:rgba(255,255,255,.14);
  padding:8px 12px;
  border-radius:999px;
  font-size:13px;
  font-weight:700;
  white-space:nowrap;
}

.wrap{
  max-width:1180px;
  margin:0 auto;
  padding:18px 14px 80px;
}

.glass{
  background:var(--card);
  backdrop-filter:blur(16px);
  border:1px solid rgba(255,255,255,.5);
  border-radius:var(--radius);
  box-shadow:var(--shadow);
}

.hero{
  padding:18px;
  margin-bottom:16px;
}

.hero-top{
  display:flex;
  flex-wrap:wrap;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  margin-bottom:14px;
}

.title{
  font-size:28px;
  font-weight:900;
  letter-spacing:-0.6px;
  margin:0;
}

.subtitle{
  color:var(--muted);
  font-size:14px;
  margin-top:6px;
}

.search-row{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
  margin-top:14px;
}

.search-box{
  flex:1 1 260px;
  display:flex;
  align-items:center;
  gap:10px;
  background:#fff;
  border:1px solid var(--line);
  border-radius:16px;
  padding:12px 14px;
}

.search-box input{
  border:none;
  outline:none;
  width:100%;
  font-size:15px;
  background:transparent;
}

.quick-actions{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
}

.quick-btn{
  border:none;
  border-radius:16px;
  padding:12px 14px;
  font-weight:800;
  cursor:pointer;
  background:linear-gradient(90deg,var(--gs-blue),var(--gs-sky));
  color:#fff;
  box-shadow:0 6px 14px rgba(0,111,207,.18);
}

.quick-btn.secondary{
  background:#fff;
  color:var(--gs-blue);
  border:1px solid var(--line);
  box-shadow:none;
}

.section{
  margin-top:18px;
}

.section-head{
  display:flex;
  align-items:end;
  justify-content:space-between;
  gap:12px;
  margin-bottom:12px;
}

.section-title{
  margin:0;
  font-size:22px;
  font-weight:900;
  letter-spacing:-0.5px;
}

.section-desc{
  margin:4px 0 0;
  color:var(--muted);
  font-size:14px;
}

.featured-grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:14px;
}

.featured-card{
  position:relative;
  overflow:hidden;
  background:linear-gradient(180deg,#ffffff, #f8fbff);
  border:1px solid var(--line);
  border-radius:22px;
  padding:14px;
  box-shadow:0 10px 24px rgba(15, 23, 42, 0.05);
}

.featured-badge{
  position:absolute;
  top:12px;
  left:12px;
  background:linear-gradient(90deg,var(--gs-orange),#ff9f45);
  color:#fff;
  font-size:12px;
  font-weight:900;
  padding:7px 10px;
  border-radius:999px;
  z-index:2;
}

.featured-image-wrap{
  height:170px;
  display:flex;
  align-items:center;
  justify-content:center;
  margin-bottom:10px;
}

.featured-card img{
  width:100%;
  height:100%;
  object-fit:contain;
}

.featured-name{
  font-size:15px;
  font-weight:800;
  line-height:1.35;
  min-height:42px;
  word-break:keep-all;
}

.featured-price{
  margin-top:8px;
  font-size:22px;
  font-weight:900;
  color:var(--gs-blue);
}

.toolbar{
  position:sticky;
  top:74px;
  z-index:90;
  margin-top:16px;
  padding:12px;
}

.categories{
  display:flex;
  flex-wrap:wrap;
  gap:10px;
}

.cat-btn{
  border:none;
  padding:12px 16px;
  border-radius:999px;
  background:#fff;
  color:var(--gs-blue);
  cursor:pointer;
  font-weight:900;
  font-size:14px;
  border:1px solid var(--line);
  transition:.2s ease;
}

.cat-btn.active{
  color:#fff;
  background:linear-gradient(90deg,var(--gs-blue),var(--gs-sky));
  border-color:transparent;
  box-shadow:0 8px 18px rgba(0,111,207,.2);
}

.content-grid{
  margin-top:16px;
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:16px;
}

.product{
  position:relative;
  overflow:hidden;
  background:#fff;
  border-radius:22px;
  border:1px solid var(--line);
  padding:14px;
  box-shadow:0 10px 24px rgba(15, 23, 42, 0.05);
}

.product.soldout{
  opacity:.72;
}

.product-top{
  position:relative;
  height:170px;
  display:flex;
  align-items:center;
  justify-content:center;
  margin-bottom:10px;
}

.product img{
  width:100%;
  height:100%;
  object-fit:contain;
}

.soldout-badge{
  position:absolute;
  top:10px;
  right:10px;
  background:#111827;
  color:#fff;
  padding:8px 10px;
  border-radius:999px;
  font-size:12px;
  font-weight:900;
  z-index:2;
}

.product-name{
  font-size:15px;
  line-height:1.4;
  font-weight:800;
  min-height:44px;
  word-break:keep-all;
}

.product-meta{
  margin-top:8px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
}

.price{
  font-size:22px;
  font-weight:900;
  color:var(--gs-blue);
}

.meta-chip{
  font-size:12px;
  font-weight:800;
  color:#64748b;
  background:#f8fafc;
  border:1px solid var(--line);
  padding:7px 10px;
  border-radius:999px;
}

.empty{
  grid-column:1 / -1;
  text-align:center;
  background:#fff;
  border:1px solid var(--line);
  border-radius:22px;
  padding:40px 20px;
  color:var(--muted);
  font-weight:700;
}

.footer-note{
  margin-top:16px;
  text-align:center;
  color:#667085;
  font-size:13px;
}

@media (max-width:1024px){
  .featured-grid{grid-template-columns:repeat(3,1fr)}
  .content-grid{grid-template-columns:repeat(2,1fr)}
}

@media (max-width:760px){
  .header-inner{padding:12px 12px}
  .brand img{height:36px}
  .brand-text strong{font-size:15px}
  .title{font-size:22px}
  .section-title{font-size:20px}
  .featured-grid{grid-template-columns:repeat(2,1fr)}
  .content-grid{grid-template-columns:1fr}
  .toolbar{top:68px}
  .product-top{height:150px}
  .featured-image-wrap{height:140px}
}

@media (max-width:420px){
  .featured-grid{grid-template-columns:1fr 1fr}
  .cat-btn{font-size:13px;padding:11px 14px}
}
</style>
</head>
<body>

<header class="header">
  <div class="header-inner">
    <div class="brand">
      <img src="GS25_logo.png" alt="GS25 로고">
      <div class="brand-text">
        <strong>GS25 한화생명볼파크점</strong>
        <small>QR 모바일 메뉴판</small>
      </div>
    </div>
    <div class="header-right">
      <div class="pill">모바일 주문 확인용</div>
    </div>
  </div>
</header>

<div class="wrap">

  <section class="hero glass">
    <div class="hero-top">
      <div>
        <h1 class="title">메뉴를 빠르게 확인하세요</h1>
        <div class="subtitle">분류 버튼을 누르거나 상품명을 검색해 바로 찾을 수 있습니다.</div>
      </div>
      <div class="pill" id="summaryInfo">상품 불러오는 중...</div>
    </div>

    <div class="search-row">
      <div class="search-box">
        <span>🔎</span>
        <input type="text" id="searchInput" placeholder="상품명 검색">
      </div>

      <div class="quick-actions">
        <button class="quick-btn" id="showFeaturedBtn">대표상품 보기</button>
        <button class="quick-btn secondary" id="showAllBtn">전체 보기</button>
      </div>
    </div>
  </section>

  <section class="section" id="featuredSection">
    <div class="section-head">
      <div>
        <h2 class="section-title">대표상품</h2>
        <p class="section-desc">엑셀에서 대표상품=1 로 표시한 상품이 상단에 노출됩니다.</p>
      </div>
    </div>
    <div class="featured-grid" id="featuredList"></div>
  </section>

  <section class="toolbar glass">
    <div class="categories" id="categoryButtons"></div>
  </section>

  <section class="section">
    <div class="section-head">
      <div>
        <h2 class="section-title" id="currentTitle">전체 상품</h2>
        <p class="section-desc" id="currentDesc">카테고리를 선택하면 상품을 볼 수 있습니다.</p>
      </div>
    </div>
    <div class="content-grid" id="productList"></div>
    <div class="footer-note">이미지가 없는 상품은 텍스트만 표시됩니다.</div>
  </section>

</div>

<script>
let products = {};
let featuredProducts = [];
let allProducts = [];
let currentCategory = null;

fetch("menu.xlsx")
  .then(res => res.arrayBuffer())
  .then(data => {
    const workbook = XLSX.read(data, { type: "array" });
    const sheet = workbook.Sheets[workbook.SheetNames[0]];
    const rows = XLSX.utils.sheet_to_json(sheet);

    rows.forEach(r => {
      const category = String(r["분류"] ?? "").trim();
      const name = String(r["상품명"] ?? "").trim();
      const price = r["가격"];
      const featured = String(r["대표상품"] ?? "0").trim() === "1";
      const soldout = String(r["품절"] ?? "0").trim() === "1";

      if (!category || !name) return;

      const item = {
        category,
        name,
        price,
        featured,
        soldout
      };

      if (!products[category]) products[category] = [];
      products[category].push(item);
      allProducts.push(item);
      if (featured) featuredProducts.push(item);
    });

    createButtons();
    renderFeatured();
    updateSummary();

    const firstCategory = Object.keys(products)[0];
    if (firstCategory) {
      setActiveButton(firstCategory);
      showCategory(firstCategory);
    }
  })
  .catch(err => {
    document.getElementById("productList").innerHTML =
      `<div class="empty">menu.xlsx를 불러오지 못했습니다.<br>파이썬 서버 실행 상태인지 확인해주세요.</div>`;
    console.error(err);
  });

function formatPrice(value) {
  const num = Number(value);
  if (Number.isNaN(num)) return `${value}`;
  return num.toLocaleString("ko-KR") + "원";
}

function createButtons() {
  const container = document.getElementById("categoryButtons");
  container.innerHTML = "";

  const allBtn = document.createElement("button");
  allBtn.className = "cat-btn";
  allBtn.textContent = "전체";
  allBtn.onclick = () => {
    currentCategory = "전체";
    setActiveButton("전체");
    showAllProducts();
  };
  container.appendChild(allBtn);

  Object.keys(products).forEach(cat => {
    const btn = document.createElement("button");
    btn.className = "cat-btn";
    btn.textContent = cat;
    btn.onclick = () => {
      currentCategory = cat;
      setActiveButton(cat);
      showCategory(cat);
    };
    container.appendChild(btn);
  });
}

function setActiveButton(category) {
  document.querySelectorAll(".cat-btn").forEach(btn => {
    btn.classList.toggle("active", btn.textContent === category);
  });
}

function renderFeatured() {
  const featuredList = document.getElementById("featuredList");
  if (!featuredProducts.length) {
    featuredList.innerHTML = `<div class="empty">대표상품으로 지정된 상품이 없습니다.</div>`;
    return;
  }

  featuredList.innerHTML = featuredProducts.map(item => `
    <div class="featured-card">
      <div class="featured-badge">대표상품</div>
      <div class="featured-image-wrap">
        <img
          src="images/${item.name}.jpg"
          alt="${item.name}"
          onerror="this.onerror=null; this.src='images/${item.name}.png'; this.onerror=function(){this.style.display='none';};"
        >
      </div>
      <div class="featured-name">${item.name}</div>
      <div class="featured-price">${formatPrice(item.price)}</div>
    </div>
  `).join("");
}

function renderProducts(items, title, desc) {
  const list = document.getElementById("productList");
  document.getElementById("currentTitle").textContent = title;
  document.getElementById("currentDesc").textContent = desc;

  if (!items.length) {
    list.innerHTML = `<div class="empty">표시할 상품이 없습니다.</div>`;
    return;
  }

  list.innerHTML = items.map(item => `
    <div class="product ${item.soldout ? 'soldout' : ''}">
      <div class="product-top">
        ${item.soldout ? `<div class="soldout-badge">품절</div>` : ``}
        <img
          src="images/${item.name}.jpg"
          alt="${item.name}"
          onerror="this.onerror=null; this.src='images/${item.name}.png'; this.onerror=function(){this.style.display='none';};"
        >
      </div>
      <div class="product-name">${item.name}</div>
      <div class="product-meta">
        <div class="price">${formatPrice(item.price)}</div>
        <div class="meta-chip">${item.category}</div>
      </div>
    </div>
  `).join("");
}

function showCategory(category) {
  const items = products[category] || [];
  renderProducts(items, category, `${category} 상품 ${items.length}개`);
}

function showAllProducts() {
  renderProducts(allProducts, "전체 상품", `전체 상품 ${allProducts.length}개`);
}

function updateSummary() {
  document.getElementById("summaryInfo").textContent =
    `총 ${allProducts.length}개 · 대표 ${featuredProducts.length}개`;
}

document.getElementById("searchInput").addEventListener("input", function() {
  const keyword = this.value.trim().toLowerCase();

  if (!keyword) {
    if (currentCategory && currentCategory !== "전체") {
      showCategory(currentCategory);
    } else {
      showAllProducts();
    }
    return;
  }

  const base = currentCategory && currentCategory !== "전체"
    ? (products[currentCategory] || [])
    : allProducts;

  const filtered = base.filter(item => item.name.toLowerCase().includes(keyword));
  renderProducts(filtered, "검색 결과", `"${this.value}" 검색 결과 ${filtered.length}개`);
});

document.getElementById("showFeaturedBtn").addEventListener("click", () => {
  document.getElementById("featuredSection").scrollIntoView({ behavior: "smooth", block: "start" });
});

document.getElementById("showAllBtn").addEventListener("click", () => {
  currentCategory = "전체";
  setActiveButton("전체");
  showAllProducts();
});
</script>

</body>
</html>
