<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GS25 한화생명볼파크 메뉴판</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

<style>

:root{
--gs-blue:#006fcf;
--gs-sky:#00a9e0;
--gs-orange:#ff7a00;
--line:#e5edf6;
}

body{
font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto;
margin:0;
background:linear-gradient(135deg,#eef3f8,#dde8f5);
}

/* HEADER */

.header{
background:linear-gradient(90deg,#006FCF,#00A9E0);
padding:18px;
color:white;
}

.header-inner{
max-width:1100px;
margin:auto;
display:flex;
justify-content:space-between;
align-items:center;
gap:12px;
}

.brand{
display:flex;
align-items:center;
gap:10px;
min-width:0;
}

.brand img{
height:42px;
}

.brand-text strong{
display:block;
font-size:18px;
}

.brand-text small{
opacity:.9;
font-size:13px;
}

.pill{
background:rgba(255,255,255,.15);
padding:10px 14px;
border-radius:30px;
font-weight:700;
font-size:14px;
white-space:nowrap;
}

/* LAYOUT */

.wrap{
max-width:1100px;
margin:auto;
padding:20px;
}

/* BEST TITLE */

.best-title{
margin-bottom:10px;
font-size:24px;
font-weight:900;
color:#111;
display:flex;
align-items:center;
gap:8px;
flex-wrap:wrap;
}

.best-badge{
background:linear-gradient(90deg,#ff7a00,#ffb347);
color:white;
font-size:12px;
font-weight:900;
padding:4px 8px;
border-radius:20px;
}

/* FEATURED */

.featured-grid{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:14px;
}

.featured-card{
background:white;
border-radius:16px;
padding:14px;
border:1px solid var(--line);
text-align:center;
}

.featured-card img{
width:100%;
height:150px;
object-fit:contain;
}

.featured-name{
font-weight:700;
margin-top:6px;
word-break:keep-all;
}

.featured-price{
color:var(--gs-blue);
font-weight:900;
font-size:20px;
}

/* CATEGORY */

.categories{
display:flex;
flex-wrap:wrap;
gap:10px;
margin-top:20px;
}

.cat-btn{
border:none;
padding:12px 16px;
border-radius:25px;
background:white;
border:1px solid var(--line);
cursor:pointer;
font-weight:700;
}

.cat-btn.active{
background:linear-gradient(90deg,var(--gs-blue),var(--gs-sky));
color:white;
}

/* PRODUCT GRID */

.content-grid{
margin-top:20px;
display:grid;
grid-template-columns:repeat(3,1fr);
gap:16px;
}

.product{
background:white;
border-radius:16px;
padding:12px;
border:1px solid var(--line);
text-align:center;
}

.product img{
width:100%;
height:140px;
object-fit:contain;
}

.product-name{
font-weight:700;
margin-top:6px;
word-break:keep-all;
}

.price{
color:var(--gs-blue);
font-weight:900;
font-size:18px;
}

.add-cart-btn{
margin-top:10px;
width:100%;
border:none;
padding:10px;
border-radius:12px;
background:linear-gradient(90deg,var(--gs-blue),var(--gs-sky));
color:white;
font-weight:700;
cursor:pointer;
}

/* CART */

.cart-fab{
position:fixed;
right:20px;
bottom:20px;
border:none;
padding:14px 18px;
border-radius:30px;
background:linear-gradient(90deg,var(--gs-blue),var(--gs-sky));
color:white;
font-weight:900;
cursor:pointer;
z-index:1000;
box-shadow:0 8px 20px rgba(0,0,0,.18);
}

.cart-drawer{
position:fixed;
top:0;
right:-400px;
width:350px;
height:100%;
background:white;
box-shadow:-10px 0 20px rgba(0,0,0,.1);
transition:.3s;
padding:20px;
overflow:auto;
z-index:1001;
}

.cart-drawer.show{
right:0;
}

.cart-item{
border-bottom:1px solid var(--line);
padding:10px 0;
word-break:keep-all;
}

.cart-total{
font-weight:900;
font-size:18px;
margin-top:10px;
}

/* CART CLOSE */

.cart-close{
margin-top:10px;
width:100%;
border:none;
padding:10px;
border-radius:10px;
background:#111;
color:white;
font-weight:700;
cursor:pointer;
}

/* CART CLEAR */

.cart-clear{
margin-top:10px;
width:100%;
border:none;
padding:10px;
border-radius:10px;
background:#f3f4f6;
color:#111;
font-weight:700;
cursor:pointer;
border:1px solid var(--line);
}

/* MOBILE OPTIMIZATION */

@media (max-width: 900px){
.featured-grid{
grid-template-columns:repeat(2,1fr);
}
.content-grid{
grid-template-columns:repeat(2,1fr);
}
}

@media (max-width: 640px){
.header{
padding:14px;
}

.header-inner{
flex-direction:column;
align-items:flex-start;
}

.brand img{
height:36px;
}

.brand-text strong{
font-size:16px;
}

.brand-text small{
font-size:12px;
}

.pill{
font-size:12px;
padding:8px 12px;
white-space:normal;
}

.wrap{
padding:14px;
}

.best-title{
font-size:20px;
margin-bottom:12px;
}

.best-badge{
font-size:11px;
}

.featured-grid{
grid-template-columns:1fr;
gap:12px;
}

.categories{
gap:8px;
margin-top:16px;
}

.cat-btn{
padding:10px 14px;
font-size:14px;
}

.content-grid{
grid-template-columns:1fr;
gap:12px;
}

.product{
padding:12px;
}

.product img{
height:160px;
}

.featured-card img{
height:170px;
}

.product-name,
.featured-name{
font-size:15px;
line-height:1.45;
}

.price,
.featured-price{
font-size:20px;
}

.cart-fab{
right:14px;
bottom:14px;
padding:13px 16px;
font-size:15px;
}

.cart-drawer{
width:100%;
right:-100%;
padding:16px;
}
}

</style>
</head>

<body>

<header class="header">
<div class="header-inner">

<div class="brand">
<img src="GS25_logo.png">
<div class="brand-text">
<strong>GS25 한화생명볼파크점</strong>
<small>QR 모바일 메뉴판</small>
</div>
</div>

<div class="pill">
결제는 현장에서 가능합니다
</div>

</div>
</header>

<div class="wrap">

<div class="best-title">
BEST 상품
<span class="best-badge">추천</span>
</div>

<div class="featured-grid" id="featuredList"></div>

<div class="categories" id="categoryButtons"></div>

<div class="content-grid" id="productList"></div>

</div>

<button class="cart-fab" onclick="openCart()">
장바구니 (<span id="cartCount">0</span>)
</button>

<div class="cart-drawer" id="cartDrawer">
<h3>장바구니</h3>

<div id="cartItems"></div>

<div class="cart-total" id="cartTotal"></div>

<button class="cart-clear" onclick="clearCart()">장바구니 비우기</button>
<button class="cart-close" onclick="closeCart()">닫기</button>
</div>

<script>

let products={}
let allProducts=[]
let cart=[]

fetch("menu.xlsx")
.then(res=>res.arrayBuffer())
.then(data=>{

const workbook=XLSX.read(data,{type:"array"})
const sheet=workbook.Sheets[workbook.SheetNames[0]]
const rows=XLSX.utils.sheet_to_json(sheet)

rows.forEach(r=>{

let item={
category:r["분류"],
name:r["상품명"],
price:r["가격"],
featured:String(r["대표상품"])==="1",
soldout:String(r["품절"])==="1"
}

if(!products[item.category]){
products[item.category]=[]
}

products[item.category].push(item)
allProducts.push(item)

})

createButtons()
renderFeatured()
showCategory(Object.keys(products)[0])

})

function createButtons(){

const container=document.getElementById("categoryButtons")

Object.keys(products).forEach(cat=>{

let btn=document.createElement("button")
btn.className="cat-btn"
btn.textContent=cat

btn.onclick=()=>showCategory(cat)

container.appendChild(btn)

})

}

function renderFeatured(){

const list=document.getElementById("featuredList")

const featured=allProducts.filter(p=>p.featured)

list.innerHTML=featured.map(item=>`

<div class="featured-card">

<img src="images/${item.name}.jpg"
onerror="this.src='images/${item.name}.png'">

<div class="featured-name">${item.name}</div>
<div class="featured-price">${item.price}원</div>

</div>

`).join("")

}

function showCategory(cat){

const list=document.getElementById("productList")

list.innerHTML=products[cat].map(item=>`

<div class="product">

<img src="images/${item.name}.jpg"
onerror="this.src='images/${item.name}.png'">

<div class="product-name">${item.name}</div>

<div class="price">${item.price}원</div>

${item.soldout ? "품절" : `<button class="add-cart-btn" onclick="addCart('${item.name}')">장바구니 담기</button>`}

</div>

`).join("")

}

function addCart(name){

let item=allProducts.find(p=>p.name===name)

let found=cart.find(c=>c.name===name)

if(found){
found.qty++
}else{
cart.push({name:name,price:item.price,qty:1})
}

updateCart()

}

function updateCart(){

document.getElementById("cartCount").innerText=cart.reduce((s,i)=>s+i.qty,0)

const items=document.getElementById("cartItems")

items.innerHTML=cart.length ? cart.map((c,i)=>`

<div class="cart-item">
${c.name}<br>
${c.qty}개 / ${c.price*c.qty}원
</div>

`).join("") : `<div class="cart-item">장바구니가 비어 있습니다.</div>`

let total=cart.reduce((s,i)=>s+i.price*i.qty,0)

document.getElementById("cartTotal").innerText="합계 "+total+"원"

}

function openCart(){
document.getElementById("cartDrawer").classList.toggle("show")
}

function closeCart(){
document.getElementById("cartDrawer").classList.remove("show")
}

function clearCart(){
cart=[]
updateCart()
}

</script>

</body>
</html>
