<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GS25 한화생명볼파크 메뉴판</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

<style>

:root{
--gs-blue:#006fcf;
--gs-sky:#00a9e0;
--gs-orange:#ff7a00;
--line:#e5edf6;
--active-yellow:#ffd84d;
--active-yellow-border:#f2c200;
}

*{
box-sizing:border-box;
}

body{
font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;
margin:0;
background:linear-gradient(135deg,#eef3f8,#dde8f5);
color:#111;
}

/* HEADER */

.header{
background:linear-gradient(90deg,#006FCF,#00A9E0);
padding:18px;
color:white;
}

.header-inner{
max-width:1100px;
margin:auto;
display:flex;
justify-content:space-between;
align-items:center;
gap:12px;
}

.brand{
display:flex;
align-items:center;
gap:10px;
min-width:0;
}

.brand img{
height:42px;
width:auto;
display:block;
}

.brand-text{
min-width:0;
}

.brand-text strong{
display:block;
font-size:18px;
line-height:1.2;
word-break:keep-all;
}

.brand-text small{
opacity:.9;
font-size:13px;
line-height:1.2;
}

.pill{
background:rgba(255,255,255,.15);
padding:10px 14px;
border-radius:30px;
font-weight:700;
font-size:15px;
white-space:nowrap;
text-align:center;
display:flex;
align-items:center;
justify-content:center;
gap:8px;
}

.pill-alert{
color:#ffd84d;
font-weight:900;
}

.pill-note{
color:#fff;
font-weight:800;
}

.visitor-counter-wrap{
max-width:1100px;
margin:0 auto 10px;
}

.visitor-counter{
font-weight:800;
font-size:15px;
line-height:1.2;
color:white;
}

.visitor-counter-number{
font-variant-numeric:tabular-nums;
}

@media (max-width:640px){
.visitor-counter-wrap{
margin:0 auto 8px;
}
.visitor-counter{
font-size:13px;
}
}

/* LAYOUT */

.wrap{
max-width:1100px;
margin:auto;
padding:20px;
}

/* BEST TITLE */

.best-title{
margin-bottom:10px;
font-size:24px;
font-weight:900;
color:#111;
display:flex;
align-items:center;
gap:8px;
flex-wrap:wrap;
}

.best-badge{
background:linear-gradient(90deg,#ff7a00,#ffb347);
color:white;
font-size:12px;
font-weight:900;
padding:4px 8px;
border-radius:20px;
}

/* FEATURED */

.featured-grid{
display:grid;
grid-template-columns:repeat(5,1fr);
gap:10px;
}

.featured-card{
background:white;
border-radius:16px;
padding:10px 8px 12px;
border:1px solid var(--line);
text-align:center;
box-shadow:0 4px 14px rgba(0,0,0,.04);
}

.featured-card img{
width:100%;
height:85px;
object-fit:contain;
display:block;
}

.featured-name{
font-weight:700;
margin-top:6px;
line-height:1.3;
word-break:keep-all;
overflow-wrap:anywhere;
min-height:32px;
font-size:13px;
}

.featured-price{
color:var(--gs-blue);
font-weight:900;
font-size:15px;
margin-top:4px;
}

/* CATEGORY */

.categories{
display:flex;
flex-wrap:wrap;
gap:10px;
margin-top:20px;
}

.cat-btn{
border:none;
padding:12px 16px;
border-radius:25px;
background:white;
border:1px solid var(--line);
cursor:pointer;
font-weight:700;
font-size:15px;
line-height:1.2;
transition:.2s ease;
}

.cat-btn.active{
background:var(--active-yellow);
border:1px solid var(--active-yellow-border);
color:#111;
box-shadow:0 4px 12px rgba(242,194,0,.25);
}

/* PRODUCT GRID */

.content-grid{
margin-top:20px;
display:grid;
grid-template-columns:repeat(3,1fr);
gap:16px;
}

.product{
background:white;
border-radius:16px;
padding:12px;
border:1px solid var(--line);
text-align:center;
box-shadow:0 4px 14px rgba(0,0,0,.04);
}

.product img{
width:100%;
height:140px;
object-fit:contain;
display:block;
}

.product-name{
font-weight:700;
margin-top:8px;
line-height:1.45;
word-break:keep-all;
overflow-wrap:anywhere;
min-height:42px;
}

.price{
color:var(--gs-blue);
font-weight:900;
font-size:18px;
margin-top:6px;
}

.add-cart-btn{
margin-top:10px;
width:100%;
border:none;
padding:12px;
border-radius:12px;
background:linear-gradient(90deg,var(--gs-blue),var(--gs-sky));
color:white;
font-weight:700;
font-size:15px;
cursor:pointer;
}

/* CART */

.cart-fab{
position:fixed;
right:16px;
bottom:16px;
border:none;
padding:14px 18px;
border-radius:30px;
background:linear-gradient(90deg,var(--gs-blue),var(--gs-sky));
color:white;
font-weight:900;
font-size:15px;
cursor:pointer;
z-index:1000;
box-shadow:0 10px 24px rgba(0,0,0,.18);
}

.cart-drawer{
position:fixed;
top:0;
right:-400px;
width:350px;
max-width:100%;
height:100%;
background:white;
box-shadow:-10px 0 20px rgba(0,0,0,.1);
transition:.3s;
padding:20px;
overflow:auto;
z-index:1001;
}

.cart-drawer.show{
right:0;
}

.cart-drawer h3{
margin-top:0;
margin-bottom:14px;
font-size:22px;
}

.cart-item{
border-bottom:1px solid var(--line);
padding:10px 0;
line-height:1.5;
word-break:keep-all;
overflow-wrap:anywhere;
}

.cart-total{
font-weight:900;
font-size:18px;
margin-top:12px;
}

.cart-actions{
display:flex;
gap:8px;
margin-top:14px;
}

.cart-close-btn,
.cart-clear-btn{
flex:1;
border:none;
padding:12px;
border-radius:12px;
font-weight:800;
font-size:15px;
cursor:pointer;
}

.cart-close-btn{
background:#111;
color:white;
}

.cart-clear-btn{
background:#f4f6f8;
color:#111;
border:1px solid var(--line);
}

/* TABLET */

@media (max-width: 900px){

.header-inner{
align-items:flex-start;
flex-direction:column;
}

.pill{
white-space:normal;
}

.featured-grid{
grid-template-columns:repeat(5,1fr);
gap:8px;
}

.content-grid{
grid-template-columns:repeat(2,1fr);
}

}

/* MOBILE */

@media (max-width: 640px){

.header{
padding:14px;
}

.header-inner{
gap:10px;
}

.brand{
align-items:flex-start;
}

.brand img{
height:36px;
}

.brand-text strong{
font-size:16px;
}

.brand-text small{
font-size:12px;
}

.pill{
font-size:12px;
padding:8px 12px;
border-radius:16px;
white-space:normal;
line-height:1.3;
gap:6px;
flex-wrap:wrap;
justify-content:flex-end;
}

.wrap{
padding:12px;
}

.best-title{
font-size:20px;
margin-bottom:10px;
}

.best-badge{
font-size:12px;
}

.featured-grid{
grid-template-columns:repeat(5,minmax(0,1fr));
gap:6px;
}

.featured-card{
padding:7px 3px 8px;
border-radius:12px;
}

.featured-card img{
height:48px;
}

.featured-name{
font-size:9px;
line-height:1.2;
min-height:22px;
margin-top:5px;
}

.featured-price{
font-size:10px;
margin-top:3px;
}

.categories{
gap:8px;
margin-top:14px;
}

.cat-btn{
padding:10px 12px;
font-size:13px;
border-radius:22px;
}

.content-grid{
grid-template-columns:repeat(3,1fr);
gap:8px;
}

.product{
padding:8px;
border-radius:12px;
}

.product img{
height:88px;
}

.product-name{
font-size:12px;
min-height:auto;
line-height:1.3;
}

.price{
font-size:15px;
}

.add-cart-btn{
padding:10px 6px;
font-size:12px;
}

.cart-fab{
right:12px;
bottom:12px;
padding:13px 16px;
font-size:15px;
}

.cart-drawer{
width:100%;
right:-100%;
padding:16px;
}

.cart-drawer h3{
font-size:20px;
}

.cart-item{
font-size:15px;
}

.cart-total{
font-size:17px;
}

}

/* SMALL MOBILE */

@media (max-width: 380px){

.wrap{
padding:10px;
}

.brand-text strong{
font-size:15px;
}

.pill{
font-size:12px;
}

.featured-grid{
gap:5px;
}

.featured-card{
padding:6px 2px 7px;
}

.featured-card img{
height:42px;
}

.featured-name{
font-size:8px;
min-height:20px;
}

.featured-price{
font-size:9px;
}

.product img{
height:76px;
}

.product-name{
font-size:10px;
}

.price{
font-size:13px;
}

.add-cart-btn{
font-size:10px;
padding:9px 4px;
}

}
</style>
</head>

<body>

<header class="header">
<div class="visitor-counter-wrap"><div class="visitor-counter">오늘 방문자수 <span class="visitor-counter-number" id="visitorCount">-</span></div></div>
<div class="header-inner">

<div class="brand">
<img src="GS25_logo.png" alt="GS25 로고">
<div class="brand-text">
<strong>GS25 한화생명볼파크점</strong>
<small>QR 모바일 메뉴판</small>
</div>
</div>

<div class="pill">
<span class="pill-alert">결제는 현장에서 가능합니다</span>
<span class="pill-note">우리동네GS25 와 동일한 가격</span>
</div>

</div>
</header>

<div class="wrap">

<div class="best-title">
BEST 상품
<span class="best-badge">추천</span>
</div>

<div class="featured-grid" id="featuredList"></div>

<div class="categories" id="categoryButtons"></div>

<div class="content-grid" id="productList"></div>

</div>

<button class="cart-fab" onclick="openCart()">
장바구니 (<span id="cartCount">0</span>)
</button>

<div class="cart-drawer" id="cartDrawer">
<h3>장바구니</h3>
<div id="cartItems"></div>
<div class="cart-total" id="cartTotal"></div>

<div class="cart-actions">
<button class="cart-clear-btn" onclick="clearCart()">장바구니 비우기</button>
<button class="cart-close-btn" onclick="closeCart()">숨김</button>
</div>
</div>

<script>

let products={}
let allProducts=[]
let cart=[]
let currentCategory=""


const visitorNamespace = `${location.hostname || "local"}${location.pathname || "/"}`
const kstDate = new Intl.DateTimeFormat("en-CA",{
timeZone:"Asia/Seoul",
year:"numeric",
month:"2-digit",
day:"2-digit"
}).format(new Date())
const visitorCounterKey = `${visitorNamespace}::${kstDate}`
const visitorSessionKey = `gs25-visitor-${visitorCounterKey}`

async function updateVisitorCount(){
const counter=document.getElementById("visitorCount")
if(!counter){
return
}

try{
const alreadyCounted=sessionStorage.getItem(visitorSessionKey)==="1"
const endpoint=`https://api.countapi.xyz/${alreadyCounted ? "get" : "hit"}/gs25-menu-daily/${encodeURIComponent(visitorCounterKey)}`
const response=await fetch(endpoint,{cache:"no-store"})
const data=await response.json()

if(typeof data.value !== "undefined"){
counter.innerText=Number(data.value).toLocaleString("ko-KR")
if(!alreadyCounted){
sessionStorage.setItem(visitorSessionKey,"1")
}
}else{
counter.innerText="-"
}
}catch(e){
counter.innerText="-"
}
}

updateVisitorCount()

function encodeImagePath(name){
return encodeURIComponent(String(name).trim())
}

function buildImageTag(name, altText){
const safeName = encodeImagePath(name)
return `<img src="images/${safeName}.jpg" alt="${altText}"
onerror="
if(!this.dataset.step){this.dataset.step='1'; this.src='images/${safeName}.JPG';}
else if(this.dataset.step==='1'){this.dataset.step='2'; this.src='images/${safeName}.png';}
else if(this.dataset.step==='2'){this.dataset.step='3'; this.src='images/${safeName}.jpeg';}
else if(this.dataset.step==='3'){this.dataset.step='4'; this.src='images/${safeName}.webp';}
else if(this.dataset.step==='4'){this.dataset.step='5'; this.src='images/${safeName}.PNG';}
else if(this.dataset.step==='5'){this.dataset.step='6'; this.src='images/${safeName}.JPEG';}
else if(this.dataset.step==='6'){this.dataset.step='7'; this.src='images/${safeName}.WEBP';}
else{this.style.display='none';}
">`
}

fetch("menu.xlsx")
.then(res=>res.arrayBuffer())
.then(data=>{

const workbook=XLSX.read(data,{type:"array"})
const sheet=workbook.Sheets[workbook.SheetNames[0]]
const rows=XLSX.utils.sheet_to_json(sheet)

rows.forEach(r=>{

let item={
category:r["분류"],
name:r["상품명"],
price:r["가격"],
featured:String(r["대표상품"])==="1",
soldout:String(r["품절"])==="1"
}

if(!products[item.category]){
products[item.category]=[]
}

products[item.category].push(item)
allProducts.push(item)

})

createButtons()
renderFeatured()

const firstCategory = Object.keys(products)[0]
if(firstCategory){
showCategory(firstCategory)
setActiveCategory(firstCategory)
}

updateCart()

})

function createButtons(){

const container=document.getElementById("categoryButtons")
container.innerHTML=""

Object.keys(products).forEach(cat=>{

let btn=document.createElement("button")
btn.className="cat-btn"
btn.textContent=cat
btn.dataset.category=cat

btn.onclick=()=>{
showCategory(cat)
setActiveCategory(cat)
}

container.appendChild(btn)

})

}

function setActiveCategory(cat){
currentCategory = cat

document.querySelectorAll(".cat-btn").forEach(btn=>{
btn.classList.toggle("active", btn.dataset.category === cat)
})
}

function renderFeatured(){

const list=document.getElementById("featuredList")

const featured=allProducts.filter(p=>p.featured)

list.innerHTML=featured.map(item=>`

<div class="featured-card">

${buildImageTag(item.name, item.name)}

<div class="featured-name">${item.name}</div>
<div class="featured-price">${Number(item.price).toLocaleString()}원</div>

</div>

`).join("")

}

function showCategory(cat){

const list=document.getElementById("productList")

list.innerHTML=products[cat].map(item=>`

<div class="product">

${buildImageTag(item.name, item.name)}

<div class="product-name">${item.name}</div>

<div class="price">${Number(item.price).toLocaleString()}원</div>

${item.soldout ? "품절" : `<button class="add-cart-btn" onclick="addCart('${item.name}')">장바구니 담기</button>`}

</div>

`).join("")

}

function addCart(name){

let item=allProducts.find(p=>p.name===name)

let found=cart.find(c=>c.name===name)

if(found){
found.qty++
}else{
cart.push({name:name,price:item.price,qty:1})
}

updateCart()

}

function updateCart(){

document.getElementById("cartCount").innerText=cart.reduce((s,i)=>s+i.qty,0)

const items=document.getElementById("cartItems")

items.innerHTML=cart.length ? cart.map((c,i)=>`

<div class="cart-item">
${c.name}<br>
${c.qty}개 / ${Number(c.price*c.qty).toLocaleString()}원
</div>

`).join("") : `<div class="cart-item">장바구니가 비어 있습니다.</div>`

let total=cart.reduce((s,i)=>s+i.price*i.qty,0)

document.getElementById("cartTotal").innerText="합계 "+Number(total).toLocaleString()+"원"

}

function openCart(){
document.getElementById("cartDrawer").classList.add("show")
}

function closeCart(){
document.getElementById("cartDrawer").classList.remove("show")
}

function clearCart(){
cart=[]
updateCart()
}

</script>

</body>
</html>
